name: FreightFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: freightflow
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: freightflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://freightflow:test_password@localhost:5432/freightflow_test

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://freightflow:test_password@localhost:5432/freightflow_test

      - name: Run tests
        run: npm test
        working-directory: server
        env:
          DATABASE_URL: postgresql://freightflow:test_password@localhost:5432/freightflow_test
          JWT_SECRET: test_jwt_secret_32_chars_minimum_xx
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_32_chars_xx
          AT_API_KEY: sandbox
          AT_USERNAME: sandbox
          NODE_ENV: test

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/freightflow-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/freightflow-web:latest

      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
